[package]
name = "cloudiful-tasks"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Durable PostgreSQL-backed task execution library"
repository = "https://github.com/cloudiful/tasks"
readme = "README.md"
publish = false
include = [
    "src/**/*.rs",
    "sql/**/*.sql",
    "migrations/**/*.sql",
    "tests/**/*.rs",
    "examples/**/*.rs",
    "Cargo.lock",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
    "AGENTS.md",
]

[lib]
name = "cloudiful_tasks"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
sea-orm = { version = "2.0.4", default-features = false, features = [
    "macros",
    "with-json",
    "with-uuid",
    "with-time",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }
